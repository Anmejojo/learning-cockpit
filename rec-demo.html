<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>录制自检台 · 背诵/朗读（45 秒）</title>
<style>
:root{--bg:#0b0d12;--card:#15181f;--card2:#1b1f29;--text:#ccd2de;--muted:#98a1b3;--faint:#7d8799;
--primary:#6366f1;--primarytext:#a5b4fc;--primaryweak:rgba(99,102,241,.14);--primaryborder:rgba(99,102,241,.45);
--ok:#34d399;--warn:#fbbf24;--err:#f87171;--border:rgba(255,255,255,.07);--strong:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#191d2b 0%,var(--bg) 60%);color:var(--text);
font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:16px 12px 60px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--faint);font-size:13px;margin-bottom:14px}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);
border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.card h2{font-size:14px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
video{width:100%;border-radius:10px;background:#000;display:block}
#stage{position:relative}
#timer{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:999px;
font-size:13px;font-variant-numeric:tabular-nums}
#recDot{position:absolute;right:10px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--err);
display:none;animation:bl .9s infinite}
@keyframes bl{50%{opacity:.25}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{flex:1;min-width:120px;min-height:44px;border-radius:10px;border:1px solid var(--strong);
background:rgba(255,255,255,.04);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.danger{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.45);color:var(--err)}
button[disabled]{opacity:.45;cursor:not-allowed}
.env div{font-size:13px;display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--border)}
.env span:first-child{color:var(--muted);flex:0 0 118px}
.env span:last-child{flex:1;word-break:break-all}
.ok{color:var(--ok)}.bad{color:var(--err)}.warn{color:var(--warn)}
.note{font-size:13px;color:var(--muted);line-height:1.85}
.note b{color:var(--text)}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--strong);color:var(--muted)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;transition:.25s;
background:#1b1f29;border:1px solid var(--strong);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:9;
box-shadow:0 8px 28px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎥 录制自检台</h1>
  <div class="sub">背诵 / 朗读用：摄像头 + 收音，最长 45 秒。<b>这个页面只在本机处理，不会上传任何东西。</b></div>

  <div class="card env" id="env"><h2>① 环境自检</h2><div style="color:var(--faint);font-size:13px">检测中…</div></div>

  <div class="card">
    <h2>② 拍摄</h2>
    <div id="stage">
      <video id="preview" playsinline muted autoplay></video>
      <div id="timer">00:00 / 00:45</div>
      <div id="recDot"></div>
    </div>
    <div class="row">
      <button class="primary" id="btnStart">🔴 开始录制</button>
      <button id="btnStop" disabled>⏹ 停止</button>
      <button id="btnFlip">🔄 切换镜头</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>③ 回放 / 确认</h2>
    <video id="play" playsinline controls></video>
    <div class="note" id="info" style="margin-top:8px"></div>
    <div class="row">
      <button id="btnRedo">↺ 重录</button>
      <button class="primary" id="btnUse">✅ 用这段</button>
      <button id="btnSave">⬇ 存到本机（自己检查）</button>
    </div>
  </div>

  <div class="card note">
    <h2>④ 用之前先看这几条</h2>
    <b>必须在 HTTPS 下打开</b>（这个页面上线后在 https 地址里，没问题）；<br>
    <b>第一次会问"允许使用摄像头/麦克风"</b> → 点允许；<br>
    <b>微信里打开可能录不了</b> → 请用手机自带浏览器（Safari / Chrome / 夸克等），或把网页"添加到主屏幕"当应用打开；<br>
    <b>发现两件事，请告诉我</b>：① 录完能不能正常回放 ② 录 30 秒大概多大（页面会显示）。
  </div>
</div>
<div id="toast"></div>
<script>
var MAX=45;                     /* 秒，可调 */
var MIMES=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=h264,opus','video/webm;codecs=vp9,opus','video/webm'];
var $=function(i){return document.getElementById(i)};
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},2200)}

var stream=null,rec=null,chunks=[],blob=null,timer=null,t0=0,facing='user',mime='';

function env(){
  var secure=(location.protocol==='https:')||(location.hostname==='localhost')||(location.hostname==='127.0.0.1');
  var hasGUM=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  var hasRec=(typeof window.MediaRecorder==='function');
  var ua=navigator.userAgent||'';
  var isWeChat=/MicroMessenger/i.test(ua);
  mime='';
  if(hasRec){for(var i=0;i<MIMES.length;i++){try{if(MediaRecorder.isTypeSupported(MIMES[i])){mime=MIMES[i];break}}catch(e){}}}
  var rows=[
    ['安全环境(HTTPS)',secure?'✅ 是':'❌ 不是 —— 摄像头会被浏览器禁用',secure],
    ['摄像头/麦克风接口',hasGUM?'✅ 有':'❌ 没有（浏览器太老或非安全环境）',hasGUM],
    ['录制接口',hasRec?'✅ 有':'❌ 没有（iOS 需 14.3+）',hasRec],
    ['将使用的格式',mime?('✅ '+mime):'（用浏览器默认）',!!mime],
    ['微信内置浏览器',isWeChat?'⚠️ 是 —— 大概率录不了，请换系统浏览器':'(不是)',!isWeChat],
    ['浏览器',ua.replace(/\s+/g,' ').slice(0,90),true]
  ];
  var h='<h2>① 环境自检</h2>';
  rows.forEach(function(r){h+='<div><span>'+r[0]+'</span><span class="'+(r[2]?'ok':'bad')+'">'+r[1]+'</span></div>'});
  $('env').innerHTML=h;
  if(!secure||!hasGUM||!hasRec)toast('环境不满足，请看①里的红字');
}

async function openCam(){
  if(stream)return true;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing,width:{ideal:640},height:{ideal:480},frameRate:{ideal:24,max:24}},
      audio:{echoCancellation:true,noiseSuppression:true}
    });
    $('preview').srcObject=stream;
    $('preview').style.transform=(facing==='user')?'scaleX(-1)':'none';
    return true;
  }catch(e){
    var m=String(e&&e.name||e);
    toast('打不开摄像头：'+m);
    if(m==='NotAllowedError')toast('你点了"拒绝"，请刷新页面重新允许');
    else if(m==='NotFoundError')toast('这台设备没有可用摄像头');
    return false;
  }
}

function fmt(s){var m=Math.floor(s/60),x=Math.floor(s%60);return ('0'+m).slice(-2)+':'+('0'+x).slice(-2)}
function size(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'}

async function start(){
  if(!(await openCam()))return;
  chunks=[];blob=null;
  try{
    rec=mime?new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:700000,audioBitsPerSecond:64000}):new MediaRecorder(stream);
  }catch(e){ try{rec=new MediaRecorder(stream)}catch(e2){ toast('这台设备不支持录制'); return } }
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=function(){
    blob=new Blob(chunks,{type:(rec.mimeType||'video/webm').split(';')[0]});
    clearInterval(timer);timer=null;
    $('recDot').style.display='none';
    $('btnStart').disabled=false;$('btnStop').disabled=true;
    $('play').src=URL.createObjectURL(blob);
    $('resultCard').style.display='block';
    $('info').innerHTML='时长 <b>'+fmt(lastDur)+'</b>　大小 <b>'+size(blob.size)+'</b>　格式 <b>'+blob.type+'</b><br>'+
      '按这个大小，45 秒大约 <b>'+size(blob.size/Math.max(lastDur,1)*45)+'</b>。';
    try{$('play').play()}catch(e){}
  };
  rec.start(1000);
  t0=Date.now();lastDur=0;
  $('recDot').style.display='block';
  $('btnStart').disabled=true;$('btnStop').disabled=false;
  $('timer').textContent='00:00 / '+fmt(MAX);
  timer=setInterval(function(){
    lastDur=(Date.now()-t0)/1000;
    $('timer').textContent=fmt(lastDur)+' / '+fmt(MAX);
    if(lastDur>=MAX)stop();
  },200);
}
var lastDur=0;
function stop(){
  if(rec&&rec.state!=='inactive'){try{rec.stop()}catch(e){}}
  if(stream){stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});stream=null}
}
function reset(){
  if(stream){stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});stream=null}
  $('preview').srcObject=null;
  $('resultCard').style.display='none';
  $('timer').textContent='00:00 / '+fmt(MAX);
  blob=null;chunks=[];lastDur=0;
  openCam();
}

$('btnStart').onclick=start;
$('btnStop').onclick=stop;
$('btnFlip').onclick=function(){
  facing=(facing==='user')?'environment':'user';
  if(stream){stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});stream=null}
  openCam();
};
$('btnRedo').onclick=reset;
$('btnUse').onclick=function(){toast('✅ 正式版会：上传到云端 → 进妈妈的待审核 → 通过加分')};
$('btnSave').onclick=function(){
  if(!blob)return;
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='背诵录制_'+Date.now()+(blob.type.indexOf('mp4')>=0?'.mp4':'.webm');
  a.click();
  toast('已存到「下载」文件夹，可以自己播一下');
};
env();
openCam();
</script>
</body>
</html>
