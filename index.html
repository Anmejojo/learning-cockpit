<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学习驾驶舱">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>阿勒学习驾驶舱</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d12;--bg-elev:#12151c;--card:#15181f;--card-2:#1b1f29;
  --text:#e6e8ee;--muted:#98a1b3;--faint:#7d8799;
  --primary:#6366f1;--primary-hover:#818cf8;--primary-weak:rgba(99,102,241,0.14);--primary-border:rgba(99,102,241,0.45);
  --success:#34d399;--success-weak:rgba(52,211,153,0.12);--success-border:rgba(52,211,153,0.4);
  --warning:#fbbf24;--warning-weak:rgba(251,191,36,0.12);--warning-border:rgba(251,191,36,0.4);
  --danger:#f87171;--danger-weak:rgba(248,113,113,0.12);--danger-border:rgba(248,113,113,0.4);
  --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.12);
  --shadow:0 1px 2px rgba(0,0,0,0.4);--shadow-md:0 8px 28px rgba(0,0,0,0.45);
  --radius:10px;--radius-sm:7px;--nav-h:58px;
}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse 70% 45% at 50% -12%,rgba(99,102,241,0.14),transparent),radial-gradient(ellipse 50% 35% at 88% 0%,rgba(139,92,246,0.08),transparent)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* 顶栏 - 玻璃拟态 */
.topbar{background:radial-gradient(ellipse 120% 220% at 50% -30%,rgba(59,130,246,0.35),transparent 60%),linear-gradient(180deg,#0d1b2e,#081120);border-bottom:1px solid rgba(96,165,250,0.35);box-shadow:0 0 26px rgba(59,130,246,0.18),inset 0 0 46px rgba(0,0,0,0.35);color:#fff;padding:0 22px;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;overflow:hidden}
.topbar::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(96,165,250,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,0.055) 1px,transparent 1px);background-size:22px 22px}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#3b82f6,#22d3ee,#3b82f6,transparent);filter:blur(0.5px);opacity:0.9}
.topbar .logo,.topbar .badge{position:relative;z-index:1}
.topbar .logo{text-shadow:0 0 16px rgba(129,140,248,0.55)}
.topbar .logo svg{filter:drop-shadow(0 0 6px rgba(129,140,248,0.95))}
.topbar .logo{font-size:16px;font-weight:700;letter-spacing:0.3px;display:flex;align-items:center;gap:9px}
.topbar .logo .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 0 12px rgba(139,92,246,0.8)}
.topbar .badge{font-size:12.5px;padding:4px 11px;border-radius:999px;font-weight:600}
.topbar .badge.edit{background:rgba(52,211,153,0.14);color:#6ee7b7;border:1px solid rgba(52,211,153,0.3)}
.topbar .badge.view{background:rgba(148,163,184,0.14);color:#cbd5e1;border:1px solid rgba(148,163,184,0.25)}

/* 标签导航 */
.tabs{display:flex;background:rgba(11,13,18,0.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:var(--nav-h);z-index:99;padding:0 22px}
.tab-btn{padding:15px 17px;border:none;background:none;font-size:14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;transition:all 0.15s;white-space:nowrap;font-family:inherit}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:#fff;border-bottom-color:var(--primary);font-weight:600}
.tab-btn svg{vertical-align:-4px;margin-right:7px}
.tab-badge{display:inline-block;min-width:17px;height:17px;line-height:17px;padding:0 5px;margin-left:6px;border-radius:9px;background:#ef4444;color:#fff;font-size:12px;font-weight:700;text-align:center;vertical-align:1px;box-shadow:0 0 8px rgba(239,68,68,0.6)}
.logo svg{vertical-align:-4px;margin-right:8px;color:#a5b4fc}
.content{max-width:1100px;margin:0 auto;padding:22px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-header{font-size:14px;font-weight:600;margin-bottom:13px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-header .icon{width:19px;text-align:center}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;border-left:3px solid transparent;transition:border-color 0.2s}
.stat-card:hover{border-color:var(--border-strong)}
.stat-card .sv{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--text)}
.stat-card .sl{font-size:13px;color:var(--muted);margin-top:3px}
.stat-card.warn{border-left-color:var(--warning)}.stat-card.danger{border-left-color:var(--danger)}
.stat-card.success{border-left-color:var(--success)}.stat-card.primary{border-left-color:var(--primary)}

/* Hero 概览 */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.hero-item{border-radius:var(--radius);padding:17px 19px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.hero-item::before{content:'';position:absolute;top:-40%;right:-20%;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.12);filter:blur(6px)}
.hero-item.blue{background:linear-gradient(135deg,#6366f1,#7c3aed)}
.hero-item.green{background:linear-gradient(135deg,#10b981,#047857)}
.hero-item.orange{background:linear-gradient(135deg,#f59e0b,#c2410c)}
.hero-item .hl{font-size:13px;opacity:0.85;margin-bottom:5px;font-weight:600;letter-spacing:0.2px}
.hero-item .hn{font-size:31px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,0.15)}
.hero-item .hs{font-size:13px;opacity:0.85;margin-top:4px}

/* 分组标题 */
.section-title{font-size:13px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:0.8px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);margin-left:8px}

/* 进度条 */
.progress-bar{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin:7px 0}
.progress-bar .fill{height:100%;border-radius:4px;transition:width 0.5s ease}
.fill.primary{background:linear-gradient(90deg,#6366f1,#818cf8)}.fill.success{background:linear-gradient(90deg,#10b981,#34d399)}.fill.warning{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.fill.danger{background:linear-gradient(90deg,#ef4444,#f87171)}

/* 表格 */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{background:rgba(255,255,255,0.02);font-weight:600;color:var(--muted);font-size:13px;letter-spacing:0.3px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tr:hover{background:rgba(255,255,255,0.025)}

/* 按钮 */
.btn{padding:8px 15px;border:none;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all 0.15s;font-family:inherit;line-height:1.4}
.btn:active{transform:translateY(0.5px)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,0.3)}.btn-primary:hover{box-shadow:0 4px 14px rgba(99,102,241,0.45)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}.btn-success:hover{filter:brightness(1.08)}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:5px}
.btn-outline{background:transparent;border:1px solid var(--border-strong);color:var(--text)}.btn-outline:hover{background:rgba(255,255,255,0.04);border-color:var(--primary-border)}

/* 表单 */
input,select{padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13.5px;width:100%;font-family:inherit;background:var(--bg-elev);color:var(--text);transition:border-color 0.15s,box-shadow 0.15s}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:none;border-color:var(--primary-border);box-shadow:0 0 0 3px var(--primary-weak)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.form-row label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}

/* 零件卡片 */
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.part-card{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--border);transition:all 0.2s;position:relative}
.part-card:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.part-card.unlocked{border-color:var(--success-border);background:var(--success-weak)}
.part-card.locked{opacity:0.5;filter:grayscale(0.6)}
.part-card .pi{font-size:32px;margin-bottom:5px}
.part-card .pn{font-weight:600;font-size:13.5px;margin-bottom:4px;color:var(--text)}
.part-card .pv{font-size:13px;color:var(--muted);margin-bottom:5px;font-variant-numeric:tabular-nums}
.part-card .pc{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,0.04);padding:3px 9px;border-radius:4px;display:inline-block}
.pb{position:absolute;top:8px;right:8px;font-size:16px}

/* 预警 */
.alert{padding:11px 15px;border-radius:var(--radius-sm);margin-bottom:8px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.alert.warning{background:var(--warning-weak);border:1px solid var(--warning-border);color:var(--warning)}
.alert.danger{background:var(--danger-weak);border:1px solid var(--danger-border);color:var(--danger)}
.alert.success{background:var(--success-weak);border:1px solid var(--success-border);color:var(--success)}

/* 打卡 */
.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.check-item{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;border:1px solid var(--border);transition:all 0.15s;user-select:none}
.check-item:hover{border-color:var(--primary-border);background:var(--primary-weak)}
.check-item.done{border-color:var(--success-border);background:var(--success-weak)}
.check-item .ci{font-size:30px}.check-item .cl{font-size:13.5px;font-weight:600;margin-top:4px;color:var(--text)}
.check-item .cs{font-size:12.5px;color:var(--muted);margin-top:2px}

/* 快捷打卡 */
.check-quick{display:flex;gap:8px;flex-wrap:wrap}
.q-btn{padding:8px 15px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--card-2);cursor:pointer;font-size:13.5px;font-weight:500;transition:all 0.15s;font-family:inherit;color:var(--text)}
.q-btn:hover{border-color:var(--primary-border);background:var(--primary-weak)}
.q-btn.done{border-color:var(--success-border);background:var(--success-weak);color:var(--success)}
.q-btn.pending{border-color:var(--warning-border);background:var(--warning-weak);color:var(--warning)}

/* 科目折叠头 */
.subj-head{display:flex;align-items:center;gap:9px;padding:11px 13px;margin-bottom:8px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;user-select:none;transition:all 0.15s}
.subj-head:hover{border-color:var(--primary-border);background:var(--primary-weak)}
.subj-head.open{border-color:var(--primary-border)}
.subj-head .sh-name{font-weight:700;font-size:14px;min-width:46px}
.subj-head .sh-stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.subj-head .sh-arrow{margin-left:auto;color:var(--faint);font-size:12.5px;transition:transform 0.15s;display:inline-block}
.subj-head.open .sh-arrow{transform:rotate(90deg)}
.todo-card .q-btn{font-size:13.5px}

/* 积分汇总 */
.ps{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ps .psi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 19px;text-align:center;flex:1;min-width:100px}
.psi .pv{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.psi .pl{font-size:13px;color:var(--muted)}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card-2);color:var(--text);padding:12px 19px;border-radius:var(--radius-sm);font-size:13.5px;z-index:999;opacity:0;transform:translateY(16px);transition:all 0.25s;pointer-events:none;box-shadow:var(--shadow-md);border:1px solid var(--border-strong)}
.toast.show{opacity:1;transform:translateY(0)}

.view-only .edit-only{display:none!important}

/* 响应式 */
@media(max-width:768px){
  .hero{grid-template-columns:1fr}
  .hero-item .hn{font-size:26px}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .parts-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .check-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .form-row{grid-template-columns:1fr}
  .content{padding:12px 10px;max-width:100%}
  .tabs{padding:0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab-btn{padding:12px 11px;font-size:13.5px;flex:0 0 auto}
  .q-btn{padding:10px 14px;font-size:13.5px}
  .btn{padding:9px 14px;font-size:14px}
  .btn-sm{padding:7px 11px;font-size:13.5px}
  input,select{font-size:16px;padding:9px 11px}
  .check-item{padding:11px 6px}
  .check-item .ci{font-size:26px}
  .check-item .cl{font-size:13px}
  th,td{padding:8px 9px}
  table{font-size:13.5px}
  .card{padding:14px}
  .card-header{font-size:14px}
  .hero-item{padding:15px 16px}
  .topbar{padding:0 12px;gap:8px}
  .topbar .logo{font-size:14px;min-width:0;flex:1 1 auto;overflow:hidden}
  .topbar .logo .lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .badge{font-size:11.5px;padding:3px 9px;flex:0 0 auto}
  #cloudBadge{font-size:11.5px!important;flex:0 0 auto;white-space:nowrap}
  .mistake-item{padding:10px}
}
@media(max-width:430px){
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .hero-item .hn{font-size:23px}
  .streak-big{font-size:32px}
  .tab-btn{padding:11px 9px;font-size:13px}
  .btn{padding:9px 12px;font-size:13.5px}
  .btn-sm{padding:7px 10px;font-size:13px}
  .content{padding:10px 8px}
  .card{padding:12px}
  .check-grid{gap:7px}
  .check-item .cl{font-size:13px}
}
.mini-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg{display:flex;gap:6px;margin-bottom:12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:5px}
.seg-btn{flex:1;padding:9px 10px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;white-space:nowrap}
.seg-btn.on{background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,0.35)}
.seg-btn:not(.on):hover{color:var(--text);background:rgba(255,255,255,0.04)}
@media(max-width:430px){
  .topbar{gap:6px}
  .topbar .logo{font-size:13.5px}
  .topbar .badge{font-size:11px;padding:2px 7px}
  #cloudBadge{max-width:78px;overflow:hidden;text-overflow:ellipsis}
}
.countdown{background:linear-gradient(135deg,rgba(99,102,241,0.18),rgba(124,58,237,0.12));border:1px solid var(--primary-border)}
.mistake-item{padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--bg-elev)}
.task-item{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.praise-box{margin-top:12px;padding:14px 16px;border-radius:10px;font-size:15px;font-weight:600;text-align:center;background:linear-gradient(135deg,var(--primary-weak),rgba(124,58,237,0.12));border:1px solid var(--primary-border);color:#c7d2fe;line-height:1.5}
.streak-line{display:flex;align-items:baseline;gap:4px;font-size:15px}
.streak-big{font-size:40px;font-weight:800;color:var(--warning);font-variant-numeric:tabular-nums;line-height:1}
.streak-line2{font-size:13.5px;color:var(--muted);margin-top:6px}
.daily-praise{margin:0 0 14px;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;background:linear-gradient(135deg,rgba(99,102,241,0.14),rgba(139,92,246,0.1));border:1px solid var(--primary-border);color:#c7d2fe;line-height:1.5}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.subject-item{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center;transition:all 0.15s}
.subject-item.active{border-color:var(--success-border);background:var(--success-weak)}
.subject-item .subj-icon{font-size:26px}
.subject-item .subj-name{font-size:13.5px;font-weight:600;margin-top:4px}
.subject-item .subj-cnt{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
@media print{
  :root{--bg:#fff;--bg-elev:#f5f5f5;--card:#fff;--card-2:#fff;--text:#111;--muted:#555;--faint:#666;--border:#dddddd;--border-strong:#cccccc}
  body{background:#fff!important;background-image:none!important}
  .topbar,.tabs,.seg,.toast,.edit-only,#bootTip,.q-btn,#cloudBadge{display:none!important}
  .card,.part-card,.check-item,.stat-card{box-shadow:none!important;break-inside:avoid}
  .content{max-width:100%;padding:0}
  a{color:#111;text-decoration:none}
}
@media(max-width:430px){.col-sm-hide{display:none!important}}
#bootTip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(21,24,31,0.96);border:1px solid var(--border-strong);color:var(--text);padding:14px 22px;border-radius:10px;font-size:14px;z-index:9999;box-shadow:0 10px 40px rgba(0,0,0,0.5);white-space:nowrap}

</style>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
</head>
<body>
<div class="topbar"><div class="logo"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg><span class="lt">阿勒学习驾驶舱</span></div><div class="badge edit edit-only" id="modeBadge">✏️ 家长模式</div><span id="cloudBadge" style="font-size:12.5px;margin-left:8px;color:#8b93a5">🔌 连接中...</span></div>

function normalize(d){
  const df=defData()
  for(const k of Object.keys(df)){
    if(!(k in d))d[k]=df[k]
    if(k==='dailyCheckItems'&&!d.dci&&d.dailyCheckItems)d.dci=d.dailyCheckItems
  }
  if(!d.parts||d.parts.length!==PT.length){d.parts=JSON.parse(JSON.stringify(PT))}
  const _DEP=['englishVocab','homeworkPhoto','extraStudy','classNote','mistakeBook']
  if(d.dci&&Array.isArray(d.dci)){d.dci=d.dci.filter(function(it){return _DEP.indexOf(it.key)<0})}
  if(d.dci&&Array.isArray(d.dci)){const dd=defData().dci;for(const item of dd){if(!d.dci.some(function(x){return x.key===item.key})){d.dci.push(item)}}}
  if(!d.mistakeLog)d.mistakeLog={}
  return d
}
async function initCloud(){

    cloudReady=true
    return true
  }catch(e){console.error('云端初始化失败',e);setCloudStatus('连接失败',false);cloudReady=false;return false}
}
async function loadCloud(){
  if(!cloudReady)return null
  try{
    const {data,error}=await cloudRdb.from(CLOUD_TABLE).select('*').eq('id',CLOUD_ID).limit(1)
    if(error){console.error('云端读取失败',JSON.stringify(error));return null}
    _cloudReadOk=true
    if(data&&data.length>0&&data[0]&&data[0].data){
      if(data[0].updated_at){const t=Date.parse(data[0].updated_at);if(!isNaN(t))_cloudTs=t}
      return data[0].data
    }
    return null
  }catch(e){console.error('云端读取失败',e);return null}
}
async function saveCloud(d){
  if(!cloudReady){markDirty();return false}
  if(_offline){markDirty();return false}
  if(!_cloudReadOk){_dirty=true;setCloudStatus('⏳ 等待云端确认（本机已存）',false);scheduleRetry();return false}
  try{
    const ts=Date.now()
    const r=await cloudRdb.from(CLOUD_TABLE).upsert({id:CLOUD_ID,data:d,updated_at:new Date(ts).toISOString()})
    if(r&&r.error)throw new Error(JSON.stringify(r.error))
    _cloudTs=ts
    markSynced(ts)
    return true
  }catch(e){
    console.error('云端写入失败',JSON.stringify(e))
    markDirty()
    if(!_failNotified){_failNotified=true;ts('⚠️ 云端保存失败，数据已存本机，会自动重试')}
    return false
  }
}

    chk.innerHTML=(task.done?'✅ ':'⬜ ')+task.text

  function renderSubjImgs(subId){
    const box=fc.querySelector('.subj-imgs[data-sub="'+subId+'"]')
    if(!box)return
    box.innerHTML=''
    const arr=subjImgs[subId]||[]
    arr.forEach(function(b64,idx){
      const wrap=h('div',{style:'position:relative;display:inline-block'})
      wrap.appendChild(h('img',{alt:'记录照片',loading:'lazy',src:b64,style:'width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer',onClick:function(){viewImg(b64,arr)}}))

      box.appendChild(wrap)
    })

  function pasteImageTo(subId){
    ts('📋 请按 Ctrl+V 粘贴图片')
    function onPaste(e){
      const items=(e.clipboardData&&e.clipboardData.items)||[]
      let found=false
      for(const item of items){
        if(item.type&&item.type.indexOf('image')===0){
          const file=item.getAsFile()
          if(file){found=true;compressImage(file,function(b64){if(b64){if(!subjImgs[subId])subjImgs[subId]=[];subjImgs[subId].push(b64);renderSubjImgs(subId);ts('✅ 已粘贴')}})}
        }
      }
      document.removeEventListener('paste',onPaste)
      if(!found){ts('⚠️ 剪贴板里没有图片')}
    }
    document.addEventListener('paste',onPaste)
  }
  function ui(){
    const sem=fc.querySelector('#es').value
    const subs=gs(sem)
    const box=fc.querySelector('#ei')
    box.innerHTML=''
    for(const s of subs){
      const oldVal=editing&&orig&&orig.scores&&orig.scores[s.id]!=null?orig.scores[s.id]:''

          let done=0
          files.forEach(function(f){
            compressImage(f,function(b64){
              done++
              if(b64){if(!subjImgs[s.id])subjImgs[s.id]=[];subjImgs[s.id].push(b64)}
              if(done===files.length){renderSubjImgs(s.id);ts('✅ '+s.name+'已添加照片')}
            })
          })

        inp.click()

      if(newDate!==orig.date)changes.push('日期 '+orig.date+'→'+newDate)
      if(newSem!==orig.sem)changes.push('学期 '+orig.sem+'→'+newSem)
      if(newType!==orig.examType)changes.push('类型 '+orig.examType+'→'+newType)
      const keys={}
      Object.keys(orig.scores||{}).forEach(function(k){keys[k]=1})
      Object.keys(scores).forEach(function(k){keys[k]=1})
      const subNames={chinese:'语文',math:'数学',english:'英语',physics:'物理',chem:'化学',geo:'地理',bio:'生物',dao:'道法',history:'历史',pe:'体育'}

      if(!VW){D.sem=ex.sem;cu(ex)}
      sv(D);_openExamForm=false;render()
      ts(VW?'✅ 已提交等待家长审核':'✅ 成绩已保存')

function cu(ex){
  const info=ct(ex.scores,ex.sem);let ch=false
  function up(id){var p=D.parts.find(function(x){return x.id===id});if(p&&!p.unlocked){p.unlocked=true;return true}return false}
  // 初二上期中：主科均分≥100，解锁鼠标垫(1)+鼠标(2)
  if(ex.sem==='初二上'&&ex.examType==='期中'){const avg=(ex.scores.chinese+ex.scores.math+ex.scores.english)/3;if(avg>=100){if(up(1))ch=true;if(up(2))ch=true;if(up(3))ch=true}}
  const conds=[{ids:[4,5,6],s:'初二上',e:'期末',m:508},{ids:[7,8,9],s:'初二下',e:'期中',m:517},{ids:[10,11],s:'初二下',e:'期末',m:538},{ids:[12,13],s:'初三上',e:'期中',m:580},{ids:[14],s:'初三上',e:'期末',m:610},{ids:[15],s:'初三下',e:'月考',m:600},{ids:[16],s:'初三下',e:'期中',m:610},{ids:[17],s:'初三下',e:'期末',m:615}]
  for(var ci=0;ci<conds.length;ci++){var c=conds[ci];if(ex.sem===c.s&&ex.examType===c.e&&info.total>=c.m){for(var k=0;k<c.ids.length;k++){if(up(c.ids[k]))ch=true}}}
  if(ex.examType==='中考'&&info.total>=625&&up(18))ch=true
  if(ex.sem==='初二上'&&ex.examType==='期末'&&info.total>=508&&!D.phone){D.phone=true;ch=true}
  if(ch){sv(D);ts('🎉 解锁！ · '+praise('unlock'))}
}

let _checkDate=null
let _openSubj={},_onlyTodo=false
let _calY=null,_calM=null,_calSel=null
function rcal(){
  $c.innerHTML=''
  const now=new Date()
  if(_calY===null){_calY=now.getFullYear();_calM=now.getMonth()}
  const y=_calY,m=_calM
  function pad(n){return n<10?'0'+n:''+n}
  function dateStr(d){return y+'-'+pad(m+1)+'-'+pad(d)}
  function dayCount(ds){return (D.checks||[]).filter(function(c){return c.date===ds}).length}
  function dayApproved(ds){return (D.checks||[]).filter(function(c){return c.date===ds&&c.status==='approved'}).length}

  // 醒目的鼓励横幅
  const todayStr0=ymd()
  function monthDays(){const days={};for(const c of (D.checks||[])){if(c.date&&c.date.indexOf(y+'-'+pad(m+1))===0){days[c.date]=1}}return Object.keys(days).length}
  const mdays=monthDays()
  const todayCnt=(D.checks||[]).filter(function(c){return c.date===todayStr0}).length
  let praiseTxt, praiseEmoji
  if(mdays>=15){praiseTxt='火焰不停，本月已坚持 '+mdays+' 天，你太棒了！';praiseEmoji='🔥'}
  else if(mdays>=7){praiseTxt='已坚持 '+mdays+' 天，积少成多，继续加油！';praiseEmoji='🌟'}
  else if(todayCnt>0){praiseTxt='今天已打卡，给自己点个赞！';praiseEmoji='✨'}
  else if(mdays>0){praiseTxt='每一步都算数，今天也来打卡吧！';praiseEmoji='💪'}
  else{praiseTxt='今天还没打卡哦，坚持就是胜利！';praiseEmoji='✨'}
  const praiseBar=h('div',{style:'margin-bottom:14px;padding:18px 20px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 6px 24px rgba(99,102,241,0.35);text-align:center'})
  praiseBar.appendChild(h('div',{style:'font-size:32px;margin-bottom:6px'},praiseEmoji))
  praiseBar.appendChild(h('div',{style:'font-size:18px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.25);line-height:1.5'},praiseTxt))
  $c.appendChild(praiseBar)

  // 头部：月份导航
  const head=h('div',{className:'card'})
  const nav=h('div',{style:'display:flex;align-items:center;justify-content:space-between'})
  nav.appendChild(h('button',{className:'btn btn-outline btn-sm',onClick:function(){_calM--;if(_calM<0){_calM=11;_calY--}render()}},'← 上月'))
  nav.appendChild(h('div',{style:'font-size:18px;font-weight:700'},y+'年 '+(m+1)+'月'))
  nav.appendChild(h('button',{className:'btn btn-outline btn-sm',onClick:function(){_calM++;if(_calM>11){_calM=0;_calY++}render()}},'下月 →'))
  head.appendChild(nav)
  // 图例
  head.appendChild(h('div',{style:'font-size:13px;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap'},'🟢 有打卡 · ⚪ 无打卡 · 数字=当天打卡次数'))
  $c.appendChild(head)

  // 日历网格
  const firstDay=new Date(y,m,1).getDay()
  const offset=(firstDay+6)%7
  const daysInMonth=new Date(y,m+1,0).getDate()
  const calCard=h('div',{className:'card'})
  const wk=['一','二','三','四','五','六','日']
  const grid=h('div',{style:'display:grid;grid-template-columns:repeat(7,1fr);gap:4px'})
  for(const w of wk){grid.appendChild(h('div',{style:'text-align:center;font-size:13px;color:var(--faint);padding:6px 0;font-weight:600'},w))}
  for(let i=0;i<offset;i++){grid.appendChild(h('div',null))}
  const todayStr=ymd()
  for(let d=1;d<=daysInMonth;d++){
    const ds=dateStr(d)
    const cnt=dayCount(ds)
    const app=dayApproved(ds)
    const isToday=ds===todayStr
    const isSel=ds===_calSel
    const cell=h('div',{style:'min-height:56px;border-radius:8px;padding:4px;cursor:pointer;border:1px solid '+(isSel?'var(--primary-border)':isToday?'var(--border-strong)':'var(--border)')+';background:'+(cnt>0?(app===cnt&&cnt>0?'var(--success-weak)':'var(--warning-weak)'):'transparent'),onClick:function(){_calSel=(_calSel===ds)?null:ds;render()}})
    cell.appendChild(h('div',{style:'font-size:13.5px;font-weight:'+(isToday?'700':'500')+';color:'+(isToday?'var(--primary)':'var(--text)')},d))
    if(cnt>0){
      cell.appendChild(h('div',{style:'text-align:center;margin-top:4px'},h('span',{style:'display:inline-block;min-width:18px;padding:1px 6px;border-radius:10px;font-size:12.5px;font-weight:700;color:#fff;background:'+(app===cnt?'var(--success)':'var(--warning)')},cnt)))
    }else{
      cell.appendChild(h('div',{style:'text-align:center;margin-top:4px;font-size:12.5px;color:var(--faint)'},'⚪'))
    }
    grid.appendChild(cell)
  }
  calCard.appendChild(grid)
  $c.appendChild(calCard)

  // 选中日期详情
  if(_calSel){
    const selChecks=(D.checks||[]).filter(function(c){return c.date===_calSel})
    const dc=h('div',{className:'card'})
    dc.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'📅'}),_calSel+' 打卡详情（'+selChecks.length+'条）'))
    if(!selChecks.length){dc.appendChild(h('div',{style:'color:var(--muted);font-size:13.5px'},'这天没有打卡记录'))}
    else{
      for(const c of selChecks){
        const type=CHECK_TYPES.find(function(t){return t.id===c.type})||{name:c.typeName,icon:''}
        const st=c.status==='pending'?'⏳ 待审核':c.status==='approved'?'✅ 已通过':'↩️ 已退回'
        const sc2=c.status==='pending'?'var(--warning)':c.status==='approved'?'var(--success)':'var(--muted)'
        const row=h('div',{className:'mistake-item'})
        row.innerHTML='<div><strong>'+type.icon+' '+(c.subject?c.subject+'·':'')+type.name+'</strong> <span style="color:'+sc2+'">'+st+'</span> <span style="color:var(--muted);font-size:13px">+'+c.pts+'分</span></div>'
        const cImgs=checkImgs(c)
        if(cImgs.length){const cir=h('div',{style:'display:flex;flex-wrap:wrap;gap:6px;margin-top:6px'});cImgs.forEach(function(b){cir.appendChild(h('img',{alt:'记录照片',loading:'lazy',src:b,style:'width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--border)',onClick:function(){viewImg(b,cImgs)}}))});row.appendChild(cir)}
        dc.appendChild(row)
      }
    }
    $c.appendChild(dc)
  }
}

function rwk(){
  $c.innerHTML=''
  const now=new Date();const day=now.getDay()||7
  const weekStart=new Date(now);weekStart.setDate(now.getDate()-day+1)
  const weekStartStr=ymd(weekStart)
  let weekChecks=0
  for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);const ds=ymd(d);const chk=D.dailyChecks[ds];if(chk){for(const k in chk){if(chk[k])weekChecks++}}}
  const weekPoints=D.points.filter(function(p){return p.date>=weekStartStr}).reduce(function(s,p){return s+(p.type==='earn'?p.points:-p.points)},0)
  let weekMistakes=0
  for(const _c of (D.checks||[])){if(_c.date>=weekStartStr&&_c.type==='mistake'&&_c.status!=='rejected')weekMistakes++}
  const weak=[]
  const bl=D.bl||{};const bsubs=gs(D.sem)
  for(const s of bsubs){const raw=bl[s.id];if(raw!=null){const p=raw/s.full*100;if(p<60)weak.push(s.name+'('+p.toFixed(0)+'%)')}}
  const rp=h('div',{className:'card'})
  rp.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'📊'}),'学习周报'))
  rp.appendChild(h('div',{style:'font-size:13.5px;color:var(--muted);margin-bottom:12px'},'本周：'+fd(weekStartStr)+' ~ '+fd(ymd(now))))
  const items=[{icon:'✅',label:'本周打卡',val:weekChecks+' 次'},{icon:'⭐',label:'本周积分',val:(weekPoints>0?'+':'')+weekPoints+' 分'},{icon:'📕',label:'本周新增错题',val:weekMistakes+' 道'},{icon:'🎯',label:'薄弱科目',val:weak.length?weak.join('、'):'暂无'}]
  for(const it of items){rp.appendChild(h('div',{style:'display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px'},h('span',null,it.icon+' '+it.label),h('strong',null,it.val)))}
  rp.appendChild(h('div',{style:'margin-top:14px;padding:12px;background:var(--primary-weak);border-radius:8px;font-size:13.5px',innerHTML:'💡 <strong>下周建议：</strong>'+(weak.length?'重点突破 '+weak[0]+'，每天15分钟专项练习':'保持当前节奏，巩固已学知识')}))
  rp.appendChild(h('div',{className:'daily-praise',style:'margin-top:12px'},'💬 一周的坚持看得见，下周继续加油！'))
  if(!VW){
    rp.appendChild(h('button',{className:'btn btn-outline btn-sm edit-only',style:'margin-top:12px',onClick:function(){
      let txt='【阿勒学习周报】\n'+fd(weekStartStr)+' ~ '+fd(ymd(now))+'\n本周打卡：'+weekChecks+'次\n本周积分：'+(weekPoints>0?'+':'')+weekPoints+'分\n新增错题：'+weekMistakes+'道\n薄弱科目：'+(weak.length?weak.join('、'):'暂无')+'\n下周建议：'+(weak.length?'重点突破 '+weak[0]:'保持节奏')+'\n'
      navigator.clipboard.writeText(txt).then(function(){ts('✅ 周报已复制 · '+praise('week'))}).catch(function(){ts('⚠️ 复制失败')})
    }},'📋 复制周报到家庭群'))
    rp.appendChild(h('button',{className:'btn btn-success btn-sm edit-only',style:'margin-top:12px;margin-left:8px',onClick:function(){
      exportWeekly({range:fd(weekStartStr)+' ~ '+fd(ymd(now)),items:items.map(function(x){return {label:x.label,val:x.val}}),advice:(weak.length?'重点突破 '+weak[0]+'，每天15分钟专项练习':'保持当前节奏，巩固已学知识')})
    }},'🖼 存成图片发群'))
  }
  $c.appendChild(rp)
}

function sw(tab){tb=tab;document.querySelectorAll('.tab-btn').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('active',on);if(on){try{b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}catch(e){}}});render();window.scrollTo({top:0,behavior:'smooth'})}

var _cb=document.getElementById('cloudBadge')
if(_cb){_cb.style.cursor='pointer';_cb.addEventListener('click',function(){if(_dirty||!cloudReady){syncNow()}else{ts('☁️ 数据已同步（'+fmtHM(_syncT)+'）')}})}
async function checkCloudNewer(){
  if(!cloudReady||_offline)return
  try{
    const r=await cloudRdb.from(CLOUD_TABLE).select('updated_at').eq('id',CLOUD_ID).limit(1)
    const t=(r&&r.data&&r.data[0]&&r.data[0].updated_at)?Date.parse(r.data[0].updated_at):0
    if(t&&_syncT&&t>_syncT+5000&&!_dirty&&!VW){
      const cd=await loadCloud()
      if(cd){D=normalize(cd);render();markSynced(_cloudTs||Date.now());ts('🔄 已同步其他设备的最新数据')}
    }
  }catch(e){}
}
window.addEventListener('offline',function(){_offline=true;setCloudStatus('📴 离线（已存本机）',false)})
window.addEventListener('online',function(){_offline=false;setCloudStatus('🔄 网络恢复，同步中...',true);if(_dirty){saveCloud(D)}else{checkCloudNewer()}})
window.addEventListener('beforeunload',function(e){if(_dirty){e.preventDefault();e.returnValue=''}})
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&Date.now()-_lastVisCheck>120000){_lastVisCheck=Date.now();checkCloudNewer()}
})
render()
;(async function boot(){
  const _tip=document.createElement('div');_tip.id='bootTip';_tip.textContent='☁️ 正在同步云端数据…';document.body.appendChild(_tip)
  const ok=await initCloud()
  if(ok){
    setCloudStatus('🔄 同步中...',true)
    const cd=await loadCloud()
    if(!_cloudReadOk){
      setCloudStatus('⚠️ 云端未确认（本机数据安全）',false)
      _dirty=true;scheduleRetry()
    }else if(cd){
      const localT=parseInt(localStorage.getItem(SK+'_t')||'0',10)
      const localNewer=localT>_cloudTs+5000&&!D._slim
      if(!localNewer){
        D=normalize(cd)
        if(!D.dailyChecks[td]){const ds={};for(const it of (D.dci||defData().dci))ds[it.key]=false;D.dailyChecks[td]=ds}
        render();markSynced(_cloudTs||Date.now())
      }else{
        render();await saveCloud(D)
      }
    }else{
      await saveCloud(D)
    }
  }else{
    setCloudStatus('📴 本地模式（未连云端）',false)
  }
  const _t2=document.getElementById('bootTip');if(_t2)_t2.remove()
})()
