<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿勒学习驾驶舱</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d12;--bg-elev:#12151c;--card:#15181f;--card-2:#1b1f29;
  --text:#e6e8ee;--muted:#8b93a5;--faint:#5d6472;
  --primary:#6366f1;--primary-hover:#818cf8;--primary-weak:rgba(99,102,241,0.14);--primary-border:rgba(99,102,241,0.45);
  --success:#34d399;--success-weak:rgba(52,211,153,0.12);--success-border:rgba(52,211,153,0.4);
  --warning:#fbbf24;--warning-weak:rgba(251,191,36,0.12);--warning-border:rgba(251,191,36,0.4);
  --danger:#f87171;--danger-weak:rgba(248,113,113,0.12);--danger-border:rgba(248,113,113,0.4);
  --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.12);
  --shadow:0 1px 2px rgba(0,0,0,0.4);--shadow-md:0 8px 28px rgba(0,0,0,0.45);
  --radius:10px;--radius-sm:7px;--nav-h:58px;
}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse 70% 45% at 50% -12%,rgba(99,102,241,0.14),transparent),radial-gradient(ellipse 50% 35% at 88% 0%,rgba(139,92,246,0.08),transparent)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* 顶栏 - 玻璃拟态 */
.topbar{background:radial-gradient(ellipse 120% 220% at 50% -30%,rgba(59,130,246,0.35),transparent 60%),linear-gradient(180deg,#0d1b2e,#081120);border-bottom:1px solid rgba(96,165,250,0.35);box-shadow:0 0 26px rgba(59,130,246,0.18),inset 0 0 46px rgba(0,0,0,0.35);color:#fff;padding:0 22px;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;overflow:hidden}
.topbar::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(96,165,250,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,0.055) 1px,transparent 1px);background-size:22px 22px}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#3b82f6,#22d3ee,#3b82f6,transparent);filter:blur(0.5px);opacity:0.9}
.topbar .logo,.topbar .badge{position:relative;z-index:1}
.topbar .logo{text-shadow:0 0 16px rgba(129,140,248,0.55)}
.topbar .logo svg{filter:drop-shadow(0 0 6px rgba(129,140,248,0.95))}
.topbar .logo{font-size:16px;font-weight:700;letter-spacing:0.3px;display:flex;align-items:center;gap:9px}
.topbar .logo .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 0 12px rgba(139,92,246,0.8)}
.topbar .badge{font-size:11px;padding:4px 11px;border-radius:999px;font-weight:600}
.topbar .badge.edit{background:rgba(52,211,153,0.14);color:#6ee7b7;border:1px solid rgba(52,211,153,0.3)}
.topbar .badge.view{background:rgba(148,163,184,0.14);color:#cbd5e1;border:1px solid rgba(148,163,184,0.25)}

/* 标签导航 */
.tabs{display:flex;background:rgba(11,13,18,0.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:var(--nav-h);z-index:99;padding:0 22px}
.tab-btn{padding:15px 17px;border:none;background:none;font-size:14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;transition:all 0.15s;white-space:nowrap;font-family:inherit}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:#fff;border-bottom-color:var(--primary);font-weight:600}
.tab-btn svg{vertical-align:-4px;margin-right:7px}
.logo svg{vertical-align:-4px;margin-right:8px;color:#a5b4fc}
.content{max-width:1100px;margin:0 auto;padding:22px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-header{font-size:14px;font-weight:600;margin-bottom:13px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-header .icon{width:19px;text-align:center}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;border-left:3px solid transparent;transition:border-color 0.2s}
.stat-card:hover{border-color:var(--border-strong)}
.stat-card .sv{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--text)}
.stat-card .sl{font-size:12px;color:var(--muted);margin-top:3px}
.stat-card.warn{border-left-color:var(--warning)}.stat-card.danger{border-left-color:var(--danger)}
.stat-card.success{border-left-color:var(--success)}.stat-card.primary{border-left-color:var(--primary)}

/* Hero 概览 */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.hero-item{border-radius:var(--radius);padding:17px 19px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.hero-item::before{content:'';position:absolute;top:-40%;right:-20%;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.12);filter:blur(6px)}
.hero-item.blue{background:linear-gradient(135deg,#6366f1,#7c3aed)}
.hero-item.green{background:linear-gradient(135deg,#10b981,#047857)}
.hero-item.orange{background:linear-gradient(135deg,#f59e0b,#c2410c)}
.hero-item .hl{font-size:12px;opacity:0.85;margin-bottom:5px;font-weight:600;letter-spacing:0.2px}
.hero-item .hn{font-size:31px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,0.15)}
.hero-item .hs{font-size:12px;opacity:0.85;margin-top:4px}

/* 分组标题 */
.section-title{font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:0.8px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);margin-left:8px}

/* 进度条 */
.progress-bar{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin:7px 0}
.progress-bar .fill{height:100%;border-radius:4px;transition:width 0.5s ease}
.fill.primary{background:linear-gradient(90deg,#6366f1,#818cf8)}.fill.success{background:linear-gradient(90deg,#10b981,#34d399)}.fill.warning{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.fill.danger{background:linear-gradient(90deg,#ef4444,#f87171)}

/* 表格 */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{background:rgba(255,255,255,0.02);font-weight:600;color:var(--muted);font-size:12px;letter-spacing:0.3px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tr:hover{background:rgba(255,255,255,0.025)}

/* 按钮 */
.btn{padding:8px 15px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all 0.15s;font-family:inherit;line-height:1.4}
.btn:active{transform:translateY(0.5px)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,0.3)}.btn-primary:hover{box-shadow:0 4px 14px rgba(99,102,241,0.45)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}.btn-success:hover{filter:brightness(1.08)}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:5px}
.btn-outline{background:transparent;border:1px solid var(--border-strong);color:var(--text)}.btn-outline:hover{background:rgba(255,255,255,0.04);border-color:var(--primary-border)}

/* 表单 */
input,select{padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;width:100%;font-family:inherit;background:var(--bg-elev);color:var(--text);transition:border-color 0.15s,box-shadow 0.15s}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:none;border-color:var(--primary-border);box-shadow:0 0 0 3px var(--primary-weak)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.form-row label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}

/* 零件卡片 */
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.part-card{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--border);transition:all 0.2s;position:relative}
.part-card:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.part-card.unlocked{border-color:var(--success-border);background:var(--success-weak)}
.part-card.locked{opacity:0.5;filter:grayscale(0.6)}
.part-card .pi{font-size:32px;margin-bottom:5px}
.part-card .pn{font-weight:600;font-size:13px;margin-bottom:4px;color:var(--text)}
.part-card .pv{font-size:12px;color:var(--muted);margin-bottom:5px;font-variant-numeric:tabular-nums}
.part-card .pc{font-size:11px;color:var(--muted);background:rgba(255,255,255,0.04);padding:3px 9px;border-radius:4px;display:inline-block}
.pb{position:absolute;top:8px;right:8px;font-size:16px}

/* 预警 */
.alert{padding:11px 15px;border-radius:var(--radius-sm);margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:8px}
.alert.warning{background:var(--warning-weak);border:1px solid var(--warning-border);color:var(--warning)}
.alert.danger{background:var(--danger-weak);border:1px solid var(--danger-border);color:var(--danger)}
.alert.success{background:var(--success-weak);border:1px solid var(--success-border);color:var(--success)}

/* 打卡 */
.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.check-item{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;border:1px solid var(--border);transition:all 0.15s;user-select:none}
.check-item:hover{border-color:var(--primary-border);background:var(--primary-weak)}
.check-item.done{border-color:var(--success-border);background:var(--success-weak)}
.check-item .ci{font-size:30px}.check-item .cl{font-size:13px;font-weight:600;margin-top:4px;color:var(--text)}
.check-item .cs{font-size:11px;color:var(--muted);margin-top:2px}

/* 快捷打卡 */
.check-quick{display:flex;gap:8px;flex-wrap:wrap}
.q-btn{padding:8px 15px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--card-2);cursor:pointer;font-size:13px;font-weight:500;transition:all 0.15s;font-family:inherit;color:var(--text)}
.q-btn:hover{border-color:var(--primary-border);background:var(--primary-weak)}
.q-btn.done{border-color:var(--success-border);background:var(--success-weak);color:var(--success)}

/* 积分汇总 */
.ps{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ps .psi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 19px;text-align:center;flex:1;min-width:100px}
.psi .pv{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.psi .pl{font-size:12px;color:var(--muted)}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card-2);color:var(--text);padding:12px 19px;border-radius:var(--radius-sm);font-size:13px;z-index:999;opacity:0;transform:translateY(16px);transition:all 0.25s;pointer-events:none;box-shadow:var(--shadow-md);border:1px solid var(--border-strong)}
.toast.show{opacity:1;transform:translateY(0)}

.view-only .edit-only{display:none!important}

/* 响应式 */
@media(max-width:768px){
  .hero{grid-template-columns:1fr}
  .hero-item .hn{font-size:26px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .parts-grid{grid-template-columns:repeat(2,1fr)}
  .form-row{grid-template-columns:1fr}
  .content{padding:12px}
  .tabs{padding:0 8px;overflow-x:auto}
  .tab-btn{padding:13px 13px;font-size:13px}
  .q-btn{padding:8px 13px;font-size:12px}
}
.countdown{background:linear-gradient(135deg,rgba(99,102,241,0.18),rgba(124,58,237,0.12));border:1px solid var(--primary-border)}
.mistake-item{padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--bg-elev)}
.task-item{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.praise-box{margin-top:12px;padding:14px 16px;border-radius:10px;font-size:15px;font-weight:600;text-align:center;background:linear-gradient(135deg,var(--primary-weak),rgba(124,58,237,0.12));border:1px solid var(--primary-border);color:#c7d2fe;line-height:1.5}
.streak-line{display:flex;align-items:baseline;gap:4px;font-size:15px}
.streak-big{font-size:40px;font-weight:800;color:var(--warning);font-variant-numeric:tabular-nums;line-height:1}
.streak-line2{font-size:13px;color:var(--muted);margin-top:6px}
.daily-praise{margin:0 0 14px;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;background:linear-gradient(135deg,rgba(99,102,241,0.14),rgba(139,92,246,0.1));border:1px solid var(--primary-border);color:#c7d2fe;line-height:1.5}
</style>
</head>

<button class="tab-btn" data-tab="weekly"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>学习周报</button>
</div>

SUB['初二上']=[{id:'chinese',name:'语文',full:150,rate:1},{id:'math',name:'数学',full:150,rate:1},{id:'english',name:'英语',full:150,rate:1},{id:'physics',name:'物理',full:100,rate:0.9},{id:'geo',name:'地理',full:100,rate:0.3},{id:'bio',name:'生物',full:100,rate:0.3},{id:'dao',name:'道法',full:100,rate:0.5},{id:'history',name:'历史',full:100,rate:0.5},{id:'pe',name:'体育',full:40,rate:1}]

const PLANS=[{name:'基础套餐',data:'5GB+100分钟',cost:30},{name:'视频加成',data:'+5GB',cost:10},{name:'达标奖励',data:'+10GB',cost:20},{name:'优异奖励',data:'+20GB',cost:40}]
const PT=[{id:1,icon:'🖱️',name:'鼠标垫',value:30,cond:'初二上期中',det:'主科均分≥100',st:1},{id:2,icon:'🐭',name:'鼠标',value:200,cond:'初二上期中',det:'主科均分≥100',st:2},{id:3,icon:'🔌',name:'排插',value:100,cond:'初二上期中',det:'主科均分≥100',st:3},{id:4,icon:'⌨️',name:'键盘',value:400,cond:'初二上期末',det:'总分≥508',st:4},{id:5,icon:'🎧',name:'耳机',value:350,cond:'初二上期末',det:'总分≥508',st:5},{id:6,icon:'🎥',name:'摄像头',value:200,cond:'初二上期末',det:'总分≥508',st:6},{id:7,icon:'🔊',name:'音响',value:400,cond:'初二下期中',det:'总分≥517',st:7},{id:8,icon:'🎒',name:'机箱',value:350,cond:'初二下期中',det:'总分≥517',st:8},{id:9,icon:'🕹️',name:'游戏手柄',value:350,cond:'初二下期中',det:'总分≥517',st:9},{id:10,icon:'💾',name:'SSD 1TB',value:500,cond:'初二下期末',det:'总分≥538',st:10},{id:11,icon:'❄️',name:'散热器',value:300,cond:'初二下期末',det:'总分≥538',st:11},{id:12,icon:'⚡',name:'电源750W',value:500,cond:'初三上期中',det:'总分≥580',st:12},{id:13,icon:'💽',name:'机械硬盘',value:500,cond:'初三上期中',det:'总分≥580',st:13},{id:14,icon:'🧠',name:'内存32G',value:600,cond:'初三上期末',det:'总分≥610',st:14},{id:15,icon:'🔧',name:'主板',value:1000,cond:'一模≥600',det:'初三下开学',st:15},{id:16,icon:'📺',name:'显示器2K',value:1200,cond:'二模≥610',det:'初三下期中',st:16},{id:17,icon:'🧮',name:'CPU',value:1500,cond:'三模≥615',det:'中考前冲刺',st:17},{id:18,icon:'🎮',name:'显卡',value:2500,cond:'中考≥625',det:'中考达标!',st:18},{id:19,icon:'🎮',name:'Switch游戏机',value:3508,cond:'积分兑换',det:'游戏机大奖',exchange:true,st:19},{id:20,icon:'🗡️',name:'塞尔达游戏',value:287,cond:'积分兑换',det:'Switch游戏卡带',exchange:true,st:20}]

const SK='lc_v3'
function ld(){
  try{
    // Try current key first
    let r=localStorage.getItem(SK)
    // Fall back to old keys
    if(!r){r=localStorage.getItem('learning_cockpit_data')}
    if(!r){r=localStorage.getItem('learning_cockpit_v2')}
    if(r){
      const d=JSON.parse(r)
      const df=defData()
      for(const k of Object.keys(df)){
        if(!(k in d))d[k]=df[k]
        // Migrate old field names
        if(k==='dailyCheckItems'&&!d.dci&&d.dailyCheckItems)d.dci=d.dailyCheckItems
      }
      // 零件结构变更时自动重置为新清单
      if(d.parts.length!==PT.length){d.parts=JSON.parse(JSON.stringify(PT))}
      // 打卡项目新增时自动补充
      if(d.dci&&Array.isArray(d.dci)){const defDci=defData().dci;for(const item of defDci){if(!d.dci.some(function(x){return x.key===item.key})){d.dci.push(item)}}}
      // Migrate old keys to new key
      if(!localStorage.getItem(SK))localStorage.setItem(SK,JSON.stringify(d))
      return d
    }
  }catch(e){console.error('Load error:',e)}
  return defData()
}
function sv(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch(e){ts('保存失败')}}

function gs(sem){return SUB[sem]||SUB['初二上']}
function ct(sc,sem){const subs=gs(sem);let t=0,f=0;for(const s of subs){f+=s.full*s.rate;if(sc[s.id]!=null)t+=sc[s.id]*s.rate}return{total:Math.round(t*10)/10,fullTotal:Math.round(f*10)/10,pct:f>0?Math.round(t/f*1000)/10:0}}
function fd(d){if(!d)return'—';const p=d.split('-');return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日'}

function h(tag,attrs,...children){
  const el=document.createElement(tag)
  if(attrs){for(const[k,v]of Object.entries(attrs)){if(k==='className')el.className=v;else if(k==='innerHTML')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);else el.setAttribute(k,v)}}
  for(const child of children){if(child==null)continue;if(typeof child==='string')el.appendChild(document.createTextNode(child));else el.appendChild(child)}
  return el
}

function cu(ex){
  const info=ct(ex.scores,ex.sem);let ch=false
  function up(id){var p=D.parts.find(function(x){return x.id===id});if(p&&!p.unlocked){p.unlocked=true;return true}return false}
  // 初二上期中：主科均分≥100，解锁鼠标垫(1)+鼠标(2)
  if(ex.sem==='初二上'&&ex.examType==='期中'){const avg=(ex.scores.chinese+ex.scores.math+ex.scores.english)/3;if(avg>=100){if(up(1))ch=true;if(up(2))ch=true;if(up(3))ch=true}}
  const conds=[{ids:[4,5,6],s:'初二上',e:'期末',m:508},{ids:[7,8,9],s:'初二下',e:'期中',m:517},{ids:[10,11],s:'初二下',e:'期末',m:538},{ids:[12,13],s:'初三上',e:'期中',m:580},{ids:[14],s:'初三上',e:'期末',m:610},{ids:[15],s:'初三下',e:'月考',m:600},{ids:[16],s:'初三下',e:'期中',m:610},{ids:[17],s:'初三下',e:'期末',m:615}]
  for(var ci=0;ci<conds.length;ci++){var c=conds[ci];if(ex.sem===c.s&&ex.examType===c.e&&info.total>=c.m){for(var k=0;k<c.ids.length;k++){if(up(c.ids[k]))ch=true}}}
  if(ex.examType==='中考'&&info.total>=625&&up(18))ch=true
  if(ex.sem==='初二上'&&ex.examType==='期末'&&info.total>=508&&!D.phone){D.phone=true;ch=true}
  if(ch){sv(D);ts('🎉 解锁！ · '+praise('unlock'))}
}

      tdl.appendChild(inpLabel);tr.appendChild(tdl)
      const tdp=h('td')
      const inpPts=h('input',{type:'number',value:item.pts,'data-idx':i,'data-field':'pts',style:'width:60px'})
      tdp.appendChild(inpPts);tr.appendChild(tdp)
      const tdd=h('td')
      const delBtn=h('button',{className:'btn btn-danger btn-sm','data-del':i},'✕')
      delBtn.addEventListener('click',function(){
        const idx=parseInt(this.dataset.del)
        const nm=D.dci[idx].label
        if(confirm('删除：'+nm+'？')){
          const ok=D.dci[idx].key
          D.dci.splice(idx,1)
          for(const date in D.dailyChecks){if(D.dailyChecks[date][ok]!==undefined)delete D.dailyChecks[date][ok]}
          sv(D);render();ts('已删除：'+nm)
        }
      })
      tdd.appendChild(delBtn);tr.appendChild(tdd)
      edtb.appendChild(tr)
    }
    ec.appendChild(edt)
    ec.appendChild(h('button',{className:'btn btn-primary btn-sm',style:'margin-top:8px',onClick:function(){
      const inputs=ec.querySelectorAll('input[data-idx]');
      for(let ii=0;ii<inputs.length;ii++){
        const inp=inputs[ii];
        const idx=parseInt(inp.getAttribute('data-idx'));
        const field=inp.getAttribute('data-field');
        if(!isNaN(idx)&&field){
          if(field==='pts')D.dci[idx][field]=parseInt(inp.value)||1;
          else D.dci[idx][field]=inp.value;
        }
      }
      sv(D);render();ts('✅ 已更新');
    }},'💾 保存修改'))
        ec.addEventListener('click',(e)=>{const db=e.target.closest('[data-del]');if(db){const idx=parseInt(db.dataset.del);const nm=D.dci[idx].label;if(confirm('删除：'+nm+'？')){const ok=D.dci[idx].key;D.dci.splice(idx,1);for(const date in D.dailyChecks){if(D.dailyChecks[date][ok]!==undefined)delete D.dailyChecks[date][ok]}sv(D);render();ts('已删除：'+nm)}}})
    const ar=h('div',{style:'display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap'})
    ar.innerHTML='<input id="ni" placeholder="图标" style="width:60px" value="⭐"><input id="nl" placeholder="名称" style="width:140px"><input id="np" type="number" placeholder="积分" style="width:70px" value="2"><input id="nk" placeholder="英文标识" style="width:100px">'
    ar.appendChild(h('button',{className:'btn btn-success btn-sm',onClick:()=>{const icon=ec.querySelector('#ni').value||'⭐';const label=ec.querySelector('#nl').value.trim();const pts=parseInt(ec.querySelector('#np').value)||2;const key=ec.querySelector('#nk').value.trim()||('c_'+Date.now());if(!label){ts('⚠️ 请输入名称');return}D.dci.push({key,icon,label,pts});sv(D);render();ts('✅ 已添加：'+label)}},'➕ 添加项目'))
    ec.appendChild(ar)
    $c.appendChild(ec)
  }

  const sc=h('div',{className:'card'})
  sc.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'🔥'}),'连续打卡'))
  function cs_(key){let s=0;const d=new Date();for(let i=0;i<30;i++){const ds=d.toISOString().slice(0,10);const chk=D.dailyChecks[ds];if(chk&&chk[key]){s++;d.setDate(d.getDate()-1)}else break}return s}
  sc.innerHTML+='<table><thead><tr><th>项目</th><th>连续天数</th><th>状态</th></tr></thead><tbody>'+ci.map(item=>{const s=cs_(item.key);const st=s>=7?'🟢 优秀':s>=3?'🟡 良好':s>0?'🟠 一般':'🔴 未打卡';return'<tr><td>'+item.icon+' '+item.label+'</td><td><strong>'+s+'</strong> 天</td><td>'+st+'</td></tr>'}).join('')+'</tbody></table>'
  $c.appendChild(sc)
}

function rpt(){
  $c.appendChild(h('div',{className:'daily-praise'},'💡 攒下每一分，兑换你想要的奖励！'))
  const te=D.points.filter(p=>p.type==='earn').reduce((s,p)=>s+p.points,0)
  const ts_=D.points.filter(p=>p.type==='spend').reduce((s,p)=>s+p.points,0)
  const sm=h('div',{className:'ps'})
  sm.appendChild(h('div',{className:'psi'},h('div',{className:'pv',style:'color:var(--primary)'},'⭐ '+te),h('div',{className:'pl'},'累计赚取')))
  sm.appendChild(h('div',{className:'psi'},h('div',{className:'pv',style:'color:var(--danger)'},'💸 '+ts_),h('div',{className:'pl'},'已使用')))
  sm.appendChild(h('div',{className:'psi'},h('div',{className:'pv',style:'color:var(--success)'},'💰 '+(te-ts_)),h('div',{className:'pl'},'可用积分')))
  $c.appendChild(sm)

  if(!VW){
    const ac=h('div',{className:'card edit-only'})
    ac.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'➕'}),'手动添加'))
    ac.innerHTML+='<div class="form-row"><div><label>日期</label><input type="date" id="pd" value="'+td+'"></div><div><label>来源</label><input type="text" id="psrc" placeholder="如：单元测试达标"></div><div><label>分值</label><input type="number" id="pv" placeholder="正=赚，负=花"></div></div><button class="btn btn-primary btn-sm" id="bap">💾 添加</button>'
    ac.querySelector('#bap').addEventListener('click',()=>{const src=ac.querySelector('#psrc').value.trim();const val=parseInt(ac.querySelector('#pv').value);if(!src||isNaN(val)||val===0){ts('⚠️ 请填写完整');return}D.points.push({date:ac.querySelector('#pd').value,source:src,points:Math.abs(val),type:val>0?'earn':'spend'});sv(D);render();ts('✅ 已添加')})
    $c.appendChild(ac)
  }

  const dc=h('div',{className:'card'})
  dc.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'📋'}),'积分明细（'+D.points.length+'条）'))
  if(!D.points.length){dc.appendChild(h('div',{style:'text-align:center;padding:40px;color:var(--muted)'},'📭 暂无记录'))}
  else{
    const sorted=[...D.points].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,50)
    var rows2=''
    for(var pi=0;pi<sorted.length;pi++){
      var p=sorted[pi]
      rows2+='<tr><td>'+fd(p.date)+'</td><td>'+p.source+'</td>'
      rows2+='<td>'+(p.type==='earn'?'🟢 赚取':'🔴 支出')+'</td>'
      rows2+='<td style="font-weight:700;color:'+(p.type==='earn'?'var(--success)':'var(--danger)')+'">'+(p.type==='earn'?'+':'-')+p.points+'</td>'
      if(!VW){
        var btnId='btn_'+pi
        rows2+='<td><button id="'+btnId+'" class="btn btn-danger btn-sm">🗑</button></td>'
      }else{rows2+='<td></td>'}
      rows2+='</tr>'
    }
    dc.innerHTML+='<table><thead><tr><th>日期</th><th>来源</th><th>类型</th><th>分值</th><th>操作</th></tr></thead><tbody>'+rows2+'</tbody></table>'
    if(!VW){for(var pi2=0;pi2<sorted.length;pi2++){(function(p2){var el=dc.querySelector('#btn_'+pi2);if(el)el.onclick=function(){D.points=D.points.filter(function(x){return x.date!==p2.date||x.source!==p2.source});sv(D);render()}})(sorted[pi2])}}
    if(D.points.length>50)dc.appendChild(h('div',{style:'text-align:center;color:var(--muted);margin-top:8px;font-size:12px'},'仅显示最近50条'))
  }
  $c.appendChild(dc)

  const rc=h('div',{className:'card'})
  rc.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'📖'}),'积分规则 — 日常'))
  rc.innerHTML+='<table><thead><tr><th>来源</th><th>积分</th></tr></thead><tbody><tr><td>每日打卡</td><td>+2~5/次（可调）</td></tr><tr><td>单元测试达标</td><td>+15/次</td></tr></tbody></table>'
  $c.appendChild(rc)

  const erc=h('div',{className:'card'})
  erc.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'🏅'}),'积分规则 — 大考'))
  erc.innerHTML+='<table><thead><tr><th>积分项</th><th>分值</th></tr></thead><tbody><tr><td>🏅 达标基础分</td><td><strong>+150</strong></td></tr><tr><td>🚀 超标加分</td><td><strong>+15/分</strong></td></tr><tr><td>📚 单科达标</td><td><strong>+40/科</strong></td></tr><tr><td>🌟 全科达标</td><td><strong>+80</strong></td></tr><tr><td>📈 进步奖</td><td><strong>+60</strong></td></tr><tr><td>🔥 连续达标</td><td><strong>+80</strong></td></tr></tbody></table><div style="margin-top:10px;font-size:12px;color:var(--muted);padding:8px;background:#fffbeb;border-radius:6px">💡 <strong>示例：</strong>达标150 + 超标45 + 3科120 + 进步60 = <strong>375积分</strong>（按1元=1积分，≈¥375零件预算）</div>'
  $c.appendChild(erc)
}

function rmk(){
  $c.innerHTML=''
  // 辅助函数
  function streakBefore(){let s=0;const d=new Date();d.setDate(d.getDate()-1);for(let i=0;i<366;i++){const ds=d.toISOString().slice(0,10);const chk=D.dailyChecks[ds];if(chk&&chk.mistakeBook){s++;d.setDate(d.getDate()-1)}else break}return s}
  function totalDays(){let c=0;for(const ds in D.dailyChecks){if(D.dailyChecks[ds]&&D.dailyChecks[ds].mistakeBook)c++}return c}
  function reward(day){if(day===7)return 8;if(day===14)return 12;if(day===21)return 30;if(day===30)return 50;if(day>=3)return 3;return 2}

  const tchk=D.dailyChecks[td]||{}
  const todayDone=!!(tchk.mistakeBook)
  const sb=streakBefore()
  const curStreak=todayDone?(sb+1):sb
  const total=totalDays()
  const todayReward=reward(sb+1)

  // 随机鼓励语（孩子也能看到）
  const praises=['今天又巩固了知识点，越错越少！','消灭一道错题，就是消灭一个丢分点！','坚持就是胜利，好习惯正在养成！','认真整理错题，成绩稳步上升！','不放过每一道错题，你就越来越强！']
  const praise=praises[Math.floor(Math.random()*praises.length)]

  // 即将到达的里程碑提示
  let nextTip=''
  const nextMs=[{d:7,p:8},{d:14,p:12},{d:21,p:30},{d:30,p:50}]
  for(const nm of nextMs){if(curStreak<nm.d){nextTip='🔥 再坚持 <strong>'+(nm.d-curStreak)+'</strong> 天，奖励升级到 +'+nm.p+' 分！';break}}
  if(!nextTip)nextTip='🌟 已经连续 '+curStreak+' 天，太棒了，继续保持！'

  // 1. 今日错题本大卡片
  const big=h('div',{className:'card'})
  big.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'📓'}),'今日错题本'))
  const bigBtn=h('button',{className:'q-btn mk-big'+(todayDone?' done':''),style:'width:100%;padding:22px;font-size:17px;text-align:center;border-radius:12px;font-weight:700',onClick:function(){
    if(VW)return
    const nv=!D.dailyChecks[td].mistakeBook
    D.dailyChecks[td].mistakeBook=nv
    if(nv){
      const r=reward(sb+1)
      D.points.push({date:td,source:'整理错题本',points:r,type:'earn'})
      let msBonus=0
      if(!D.mistakeMilestones)D.mistakeMilestones=[]
      const totalAfter=totalDays()
      const ms=[{d:21,p:50},{d:50,p:100},{d:100,p:200}]
      for(const m of ms){if(totalAfter>=m.d&&D.mistakeMilestones.indexOf(m.d)<0){D.mistakeMilestones.push(m.d);msBonus+=m.p;D.points.push({date:td,source:'错题本里程碑'+m.d+'天',points:m.p,type:'earn'})}}
      const msg='✅ '+praise+' → +'+(r+msBonus)+'分'+(msBonus?'（含里程碑+'+msBonus+'）':'')
      sv(D);render();ts(msg)
    }else{
      D.points=D.points.filter(function(p){return !(p.date===td&&p.source==='整理错题本'&&p.type==='earn')})
      sv(D);render();ts('已取消整理')
    }
  }})
  bigBtn.innerHTML=(todayDone?'✅ ':'📓 ')+(todayDone?'今天已整理错题本':'点击标记：今天整理了错题本')+' <span style="opacity:0.75">(+'+todayReward+'分)</span>'
  big.appendChild(bigBtn)
  big.appendChild(h('div',{className:'praise-box'},'✨ '+praise))
  $c.appendChild(big)

  // 2. 连续进度卡片
  const prog=h('div',{className:'card'})
  prog.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'🔥'}),'连续进度'))
  prog.appendChild(h('div',{className:'streak-line'},h('span',{className:'streak-big'},curStreak),h('span',null,' 天连续整理错题本')))
  prog.appendChild(h('div',{className:'streak-line2'},'📚 累计整理 '+total+' 天'))
  prog.appendChild(h('div',{style:'margin-top:10px;font-size:14px;color:var(--warning)'},nextTip))
  $c.appendChild(prog)

  // 3. 奖励规则卡片（孩子也能看到）
  const rule=h('div',{className:'card'})
  rule.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'🏆'}),'坚持奖励规则'))
  rule.innerHTML+='<table><thead><tr><th>连续整理</th><th>当日奖励</th><th>说明</th></tr></thead><tbody>'+
    '<tr><td>第 1-2 天</td><td><strong>+2 分</strong></td><td>起步，门槛极低</td></tr>'+
    '<tr><td>第 3-6 天</td><td><strong>+3 分</strong></td><td>开始有加成</td></tr>'+
    '<tr style="background:var(--success-weak)"><td>第 7 天</td><td><strong>+8 分</strong></td><td>🎉 周达标！</td></tr>'+
    '<tr><td>第 8-13 天</td><td><strong>+3 分</strong></td><td></td></tr>'+
    '<tr style="background:var(--success-weak)"><td>第 14 天</td><td><strong>+12 分</strong></td><td>双周达标</td></tr>'+
    '<tr><td>第 15-20 天</td><td><strong>+3 分</strong></td><td></td></tr>'+
    '<tr style="background:var(--warning-weak)"><td>第 21 天</td><td><strong>+30 分</strong></td><td>🏆 习惯养成大奖</td></tr>'+
    '<tr><td>第 22-29 天</td><td><strong>+3 分</strong></td><td></td></tr>'+
    '<tr style="background:var(--warning-weak)"><td>第 30 天</td><td><strong>+50 分</strong></td><td>🎊 月度里程碑</td></tr>'+
    '</tbody></table>'
  rule.appendChild(h('div',{style:'margin-top:12px;font-size:13px'},'💡 <strong>累计里程碑：</strong>累计 21 天 +50 分 | 累计 50 天 +100 分 | 累计 100 天 +200 分'))
  $c.appendChild(rule)

  // 4. 最近14天记录
  const hist=h('div',{className:'card'})
  hist.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'📅'}),'最近14天记录'))
  const days=[]
  const hd=new Date()
  for(let i=0;i<14;i++){const ds=hd.toISOString().slice(0,10);const chk=D.dailyChecks[ds];days.push({date:ds,done:!!(chk&&chk.mistakeBook)});hd.setDate(hd.getDate()-1)}
  const histRow=h('div',{style:'display:flex;gap:6px;flex-wrap:wrap'})
  for(const item of days){
    const cell=h('div',{style:'text-align:center;font-size:11px;color:var(--muted);min-width:36px'})
    cell.innerHTML=(item.done?'🟢':'⚪')+'<br>'+item.date.slice(5)
    histRow.appendChild(cell)
  }
  hist.appendChild(histRow)
  hist.appendChild(h('div',{style:'font-size:12px;color:var(--faint);margin-top:8px'},'🟢=整理了  ⚪=没整理'))
  $c.appendChild(hist)

  // 说明
  const tip=h('div',{style:'font-size:13px;color:var(--muted);margin-top:10px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;line-height:1.7'},'💡 <strong>如何做：</strong>每天整理至少 1 道错题，把错题抄到错题本、弄懂错因、周末复习。每整理一次，就点上面的按钮记录，积分自动到账。坚持越久，奖励越多！')
  $c.appendChild(tip)
}

function rwk(){
  $c.innerHTML=''
  const now=new Date();const day=now.getDay()||7
  const weekStart=new Date(now);weekStart.setDate(now.getDate()-day+1)
  const weekStartStr=weekStart.toISOString().slice(0,10)
  let weekChecks=0
  for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);const ds=d.toISOString().slice(0,10);const chk=D.dailyChecks[ds];if(chk){for(const k in chk){if(chk[k])weekChecks++}}}
  const weekPoints=D.points.filter(function(p){return p.date>=weekStartStr}).reduce(function(s,p){return s+(p.type==='earn'?p.points:-p.points)},0)
  const weekMistakes=D.mistakes.filter(function(m){return m.date>=weekStartStr}).length
  const weak=[]
  const bl=D.bl||{};const bsubs=gs(D.sem)
  for(const s of bsubs){const raw=bl[s.id];if(raw!=null){const p=raw/s.full*100;if(p<60)weak.push(s.name+'('+p.toFixed(0)+'%)')}}
  const rp=h('div',{className:'card'})
  rp.appendChild(h('div',{className:'card-header'},h('span',{innerHTML:'📊'}),'学习周报'))
  rp.appendChild(h('div',{style:'font-size:13px;color:var(--muted);margin-bottom:12px'},'本周：'+fd(weekStartStr)+' ~ '+fd(now.toISOString().slice(0,10))))
  const items=[{icon:'✅',label:'本周打卡',val:weekChecks+' 次'},{icon:'⭐',label:'本周积分',val:(weekPoints>0?'+':'')+weekPoints+' 分'},{icon:'📕',label:'本周新增错题',val:weekMistakes+' 道'},{icon:'🎯',label:'薄弱科目',val:weak.length?weak.join('、'):'暂无'}]
  for(const it of items){rp.appendChild(h('div',{style:'display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px'},h('span',null,it.icon+' '+it.label),h('strong',null,it.val)))}
  rp.appendChild(h('div',{style:'margin-top:14px;padding:12px;background:var(--primary-weak);border-radius:8px;font-size:13px'},'💡 <strong>下周建议：</strong>'+(weak.length?'重点突破 '+weak[0]+'，每天15分钟专项练习':'保持当前节奏，巩固已学知识')))
  rp.appendChild(h('div',{className:'daily-praise',style:'margin-top:12px'},'💬 一周的坚持看得见，下周继续加油！'))
  if(!VW){
    rp.appendChild(h('button',{className:'btn btn-outline btn-sm edit-only',style:'margin-top:12px',onClick:function(){
      let txt='【阿勒学习周报】\n'+fd(weekStartStr)+' ~ '+fd(now.toISOString().slice(0,10))+'\n本周打卡：'+weekChecks+'次\n本周积分：'+(weekPoints>0?'+':'')+weekPoints+'分\n新增错题：'+weekMistakes+'道\n薄弱科目：'+(weak.length?weak.join('、'):'暂无')+'\n下周建议：'+(weak.length?'重点突破 '+weak[0]:'保持节奏')+'\n'
      navigator.clipboard.writeText(txt).then(function(){ts('✅ 周报已复制 · '+praise('week'))}).catch(function(){ts('⚠️ 复制失败')})
    }},'📋 复制周报到家庭群'))
  }
  $c.appendChild(rp)
}

function sw(tab){tb=tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('tabNav').addEventListener('click',(e)=>{const btn=e.target.closest('.tab-btn');if(btn)sw(btn.dataset.tab)})
render()
</script>
