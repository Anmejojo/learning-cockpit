<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>本地测试台 · 阿勒学习驾驶舱</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html,body{margin:0;height:100%;background:#0b0d12;color:#ccd2de;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600}
  .tag{font-size:12px;color:#7d8799;line-height:1.5}
  button{background:transparent;border:1px solid rgba(255,255,255,.18);color:#ccd2de;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:rgba(129,140,248,.6);color:#fff}
  .wrap{display:flex;height:calc(100% - 50px);gap:10px;padding:10px;box-sizing:border-box}
  .pane{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;background:#000}
  .pane h2{font-size:13px;margin:0;padding:7px 10px;background:#15181f;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600;display:flex;gap:8px;align-items:center}
  .pane h2 span.tip{font-weight:400;color:#7d8799;font-size:12px}
  .pane iframe{flex:1;border:0;width:100%;background:#0b0d12}
</style>
</head>
<body>
<header>
  <h1>本地测试台</h1>
  <span class="tag">本机测试数据，<b>不影响线上</b>（哥哥版 / 家长版都不动）</span>
  <button onclick="reloadFrames(true)">♻️ 重置测试数据</button>
  <button onclick="toggleDir()">⇅ 左右 / 上下</button>
  <button onclick="reloadFrames(false)">🔄 刷新两个窗口</button>
  <button onclick="window.open('https://anmejojo.github.io/learning-cockpit/','_blank')">🌐 打开线上版对比</button>
</header>
<div class="wrap" id="wrap">
  <div class="pane">
    <h2>👩 家长版 <span class="tip">可审核、可改设置、看小搭聊天</span></h2>
    <iframe id="f1" src="index.html?demo"></iframe>
  </div>
  <div class="pane">
    <h2>🧒 孩子版 <span class="tip">?view：只能看 + 打卡</span></h2>
    <iframe id="f2" src="index.html?view&demo"></iframe>
  </div>
</div>
<script>
function src(setup, reset){
  return 'index.html?' + (setup ? 'view&' : '') + 'demo' + (reset ? '&reset=1' : '') + '&t=' + Date.now();
}
function reloadFrames(reset){
  document.getElementById('f1').src = src(false, reset);
  document.getElementById('f2').src = src(true, reset);
}
function toggleDir(){
  var w = document.getElementById('wrap');
  w.style.flexDirection = (w.style.flexDirection === 'column' ? 'row' : 'column');
}
</script>
</body>
</html>
